# Temporary measurement for issue #415. This branch replaces PR CI with one
# go test -race -json run. Do not merge.
name: ci

on:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:5000/v2/"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Runner spec
        run: |
          echo "nproc=$(nproc)"
          awk '/MemTotal|MemAvailable/ {print}' /proc/meminfo
          awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo
          go version
          go env GOMAXPROCS GOGC CGO_ENABLED

      - name: Install etcd v3.7.2
        run: |
          dir="$RUNNER_TEMP/etcd"
          mkdir -p "$dir" && cd "$dir"
          base="https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}"
          tarball="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/SHA256SUMS"
          grep " ${tarball}\$" SHA256SUMS | sha256sum -c -
          tar xzf "$tarball"
          bin="$dir/etcd-${ETCD_VERSION}-linux-amd64/etcd"
          "$bin" --version
          echo "MFTIKO_ETCD_BIN=$bin" >> "$GITHUB_ENV"
        env:
          ETCD_VERSION: v3.7.2

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          bin="$(pg_config --bindir)/postgres"
          test -x "$bin"
          "$bin" --version
          echo "MFTIKO_PG_BIN=$bin" >> "$GITHUB_ENV"

      - name: go test -race -json
        env:
          MFTIKO_REQUIRE_ETCD: "1"
          MFTIKO_REQUIRE_PG: "1"
          MFTIKO_REQUIRE_REGISTRY: "1"
        run: |
          set +e
          go test -race -json ./... > "$RUNNER_TEMP/test-race.json"
          code=$?
          set -e
          echo "go_test_exit=$code"
          python3 - "$RUNNER_TEMP/test-race.json" "$RUNNER_TEMP/test-events.json" << 'PY'
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          pkgs = {}
          tests = []
          fails = []
          skips = 0
          parents = 0
          with open(src) as f, open(dst, "w") as out:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  action = ev.get("Action")
                  if action == "output":
                      continue
                  keep = {k: ev[k] for k in ("Action", "Package", "Test", "Elapsed") if k in ev}
                  if action in ("pass", "fail", "skip") and "Elapsed" in ev:
                      out.write(json.dumps(keep, separators=(",", ":")) + "\n")
                      pkg = ev.get("Package", "")
                      short = pkg.removeprefix("github.com/BullionBear/mftiko/")
                      name = ev.get("Test")
                      elapsed = float(ev["Elapsed"])
                      if not name:
                          pkgs[short] = (action, elapsed)
                      elif "/" not in name:
                          parents += 1
                          tests.append((elapsed, action, short, name))
                          if action == "fail":
                              fails.append((short, name, elapsed))
                          elif action == "skip":
                              skips += 1
          print(f"packages={len(pkgs)} parent_tests={parents} skips={skips} fails={len(fails)}")
          print(f"package_sum_s={sum(v[1] for v in pkgs.values()):.1f}")
          print("PACKAGE")
          for short, (action, elapsed) in sorted(pkgs.items(), key=lambda kv: -kv[1][1]):
              print(f"{elapsed:8.3f} {action:4} {short}")
          print("SLOWEST_PARENTS")
          for elapsed, action, short, name in sorted(tests, reverse=True)[:40]:
              print(f"{elapsed:8.3f} {action:4} {short} {name}")
          if fails:
              print("FAILS")
              for short, name, elapsed in fails:
                  print(f"{elapsed:8.3f} {short} {name}")
          PY
          mkdir -p measure-out
          cp "$RUNNER_TEMP/test-events.json" measure-out/test-events.json
          exit "$code"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-events
          path: measure-out/test-events.json
          if-no-files-found: warn
