# Pull requests and main. lint, build, and the test matrix run together.
# Shard names come from .github/test-shards.txt. The rest shard is every
# package that file does not name (.github/scripts/test-shards.sh).
# ci-ok is the aggregate. systemd is the adoption run and is not part of make check.
# E09-D090: build packs the MD and TD workers into a registry:2 service and
# pulls them back by digest. That step is not a Makefile target. The release
# workflow pushes the same script to ghcr.io; see docs/release.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ETCD_VERSION: v3.7.2

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking reads the base commit from this clone

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The pull request's base, or the previous main for a push. buf and oasdiff read it as a local branch.
      - name: Base for breaking checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git branch -f ci-base "$BASE_SHA"

      - name: buf lint
        run: make proto-lint
      - name: buf breaking
        run: make proto-breaking BUF_AGAINST='.git#branch=ci-base'
      - name: openapi lint
        run: make openapi-lint
      - name: oasdiff breaking
        run: make openapi-breaking OAS_BASE=ci-base
      - name: generated code is current
        run: make gen-check
      - name: go vet
        run: make vet

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:5000/v2/"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe stamps the release tarballs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: build
        run: make build
      # E12-D021: the unit files type-check. ExecStart paths have to exist; User=
      # and EnvironmentFile= do not. etcd is not installed here (the test job
      # does that). The path is an executable so systemd-analyze can resolve it.
      # The adoption run is the systemd job, not this one.
      - name: systemd-analyze verify
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /opt/mftiko/current/bin
          for b in mftiko-md-agent mftiko-td-agent mftiko-sts-agent mftiko-shim mftiko-controller mftiko-api mftiko-sym mftiko-etcd-backup; do
            sudo install -m 0755 "bin/$b" "/opt/mftiko/current/bin/$b"
          done
          stub=$(mktemp)
          printf '#!/bin/sh\nexit 0\n' >"$stub"
          sudo install -m 0755 "$stub" /usr/bin/etcd
          rm -f "$stub"
          dir="$RUNNER_TEMP/nats"
          mkdir -p "$dir"
          ver=v2.15.0
          (
            cd "$dir"
            base="https://github.com/nats-io/nats-server/releases/download/${ver}"
            tarball="nats-server-${ver}-linux-amd64.tar.gz"
            curl -fsSLO "$base/$tarball"
            curl -fsSLO "$base/SHA256SUMS"
            grep " ${tarball}\$" SHA256SUMS | sha256sum -c -
            tar xzf "$tarball"
          )
          sudo install -m 0755 "$dir/nats-server-${ver}-linux-amd64/nats-server" /usr/bin/nats-server
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
      # The CLI release tarballs, by the release workflow's script (E11-D035).
      - name: CLI release build
        run: make cli-dist
      # Full Go SDK conformance. Separate from go test so the suite is not run twice (E08-D064).
      - name: Go SDK conformance
        run: make sdk-conformance

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: svelte-check
        run: make web-check
      # Console production build (E10-D079). svelte-check is the step above.
      - name: web build
        run: make web
      # Host release tarball (E12-D026). make web above produces web/build. Same script as release.yml.
      - name: Server release build
        run: make server-dist
      # Same script as .github/workflows/release.yml. These tags stay on the local registry.
      - name: Pack MD and TD workers into registry:2
        env:
          REGISTRY: 127.0.0.1:5000
          PLAIN_HTTP: "1"
          TAGS: ci latest
        run: bash .github/scripts/pack-workers.sh

  # Reads the shard table. The test matrix below cannot see the file until a job
  # prints it. This job does not install Go: the names are in the file, and the
  # rest shard's packages are computed later, on that shard.
  test-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: list
        name: Read test shard table
        run: |
          set -euo pipefail
          echo "shards=$(bash .github/scripts/test-shards.sh matrix)" >> "$GITHUB_OUTPUT"

  test:
    needs: test-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.test-shards.outputs.shards) }}
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:5000/v2/"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install etcd ${{ env.ETCD_VERSION }}
        run: |
          dir="$RUNNER_TEMP/etcd"
          mkdir -p "$dir" && cd "$dir"
          base="https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}"
          tarball="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/SHA256SUMS"
          grep " ${tarball}\$" SHA256SUMS | sha256sum -c -
          tar xzf "$tarball"
          bin="$dir/etcd-${ETCD_VERSION}-linux-amd64/etcd"
          "$bin" --version
          echo "MFTIKO_ETCD_BIN=$bin" >> "$GITHUB_ENV"

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          bin="$(pg_config --bindir)/postgres"
          test -x "$bin"
          "$bin" --version
          echo "MFTIKO_PG_BIN=$bin" >> "$GITHUB_ENV"

      # Includes the conformance fakeworker violation checks (E08-D034, PROTOCOL §9.8).
      - name: go test -race
        env:
          MFTIKO_REQUIRE_ETCD: "1" # a missing etcd fails the etcd tests instead of skipping them
          MFTIKO_REQUIRE_PG: "1" # a missing postgres fails the symbol migration tests instead of skipping them
          MFTIKO_REQUIRE_REGISTRY: "1" # a missing registry:2 fails the strategy catalog test instead of skipping it (E10-D061)
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [[ "$SHARD" == rest ]]; then
            bash .github/scripts/test-shards.sh self-test
          fi
          pkgs=$(bash .github/scripts/test-shards.sh packages "$SHARD" | paste -sd ' ' -)
          if [[ -z "$pkgs" ]]; then
            if [[ "$SHARD" == rest ]]; then
              echo "rest shard is empty"
              exit 0
            fi
            echo "shard $SHARD has no packages" >&2
            exit 1
          fi
          echo "shard $SHARD: $pkgs"
          make test-race PKGS="$pkgs"

  # E12-D021: real systemd on the Ubuntu runner. etcd, NATS, and the registry come
  # from deploy/accept; the three agents run on the host and adopt across restart,
  # stop/start, and SIGKILL of MainPID. Not part of make check.
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: docker
        run: docker info

      - name: adopt shims across agent restart
        run: MFTIKO_SYSTEMD_ADOPT=1 go test -count=1 -timeout 25m -run '^TestAdopt$' ./deploy/systemd/

  # Aggregate for branch protection. It fails unless every job succeeded.
  # The individual job names are not the required checks.
  ci-ok:
    needs: [lint, build, test-shards, test, systemd]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: all jobs succeeded
        run: |
          set -eu
          fail=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "build:${{ needs.build.result }}" \
            "test-shards:${{ needs.test-shards.result }}" \
            "test:${{ needs.test.result }}" \
            "systemd:${{ needs.systemd.result }}"
          do
            name=${pair%%:*}
            result=${pair#*:}
            echo "$name $result"
            if [ "$result" != success ]; then
              fail=1
            fi
          done
          exit "$fail"
