# Runs make check (README: Make, Tests) on every pull request and on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ETCD_VERSION: v3.7.2

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking reads the base commit from this clone

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install etcd ${{ env.ETCD_VERSION }}
        run: |
          dir="$RUNNER_TEMP/etcd"
          mkdir -p "$dir" && cd "$dir"
          base="https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}"
          tarball="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/SHA256SUMS"
          grep " ${tarball}\$" SHA256SUMS | sha256sum -c -
          tar xzf "$tarball"
          bin="$dir/etcd-${ETCD_VERSION}-linux-amd64/etcd"
          "$bin" --version
          echo "MFTIKO_ETCD_BIN=$bin" >> "$GITHUB_ENV"

      # The pull request's base, or the previous main for a push; buf reads it as a local branch.
      - name: Base for buf breaking
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git branch -f ci-base "$BASE_SHA"

      # make check, one step per target so a failure names its check. Same list and order as CHECKS in the Makefile.
      - name: buf lint
        run: make proto-lint
      - name: buf breaking
        run: make proto-breaking BUF_AGAINST='.git#branch=ci-base'
      - name: generated code is current
        run: make gen-check
      - name: go vet
        run: make vet
      - name: build
        run: make build
      - name: go test -race
        env:
          MFTIKO_REQUIRE_ETCD: "1" # a missing etcd fails the etcd tests instead of skipping them
        run: make test-race
      - name: svelte-check
        run: make web-check
