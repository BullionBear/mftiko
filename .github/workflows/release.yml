# Packs the MD and TD workers and pushes them to ghcr.io/bullionbear (E09-D085–E09-D090).
# The workflow only pushes. It does not set package visibility. See docs/release.md.
# The cli job attaches the mftiko CLI tarballs and the host server tarball to the
# tag's GitHub Release (E11-D035, E12-D002). One SHA256SUMS covers both.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Require a v* tag
        run: |
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            tag:v*) ;;
            *)
              echo "this workflow runs on a v* tag: a tag push, or workflow_dispatch of that tag" >&2
              exit 1
              ;;
          esac

      - name: Pack and push workers
        env:
          REGISTRY: ghcr.io/bullionbear
          TAGS: ${{ github.ref_name }} latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash .github/scripts/pack-workers.sh

  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe reads the tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Require a v* tag
        run: |
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            tag:v*) ;;
            *)
              echo "this workflow runs on a v* tag: a tag push, or workflow_dispatch of that tag" >&2
              exit 1
              ;;
          esac

      - name: Build the CLI
        env:
          OUT: dist
        run: bash .github/scripts/build-cli.sh

      - name: Build the console
        run: make web

      # After the CLI tarballs, so SHA256SUMS is rewritten over every tarball in dist/ (E12-D002).
      - name: Build the server tarball
        env:
          OUT: dist
        run: bash .github/scripts/build-server.sh

      # The release is created once. A workflow_dispatch of the same tag replaces the assets.
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "mftiko $TAG. CLI: docs/cli.md. Host: docs/release.md."
          fi
          gh release upload "$TAG" dist/mftiko_*.tar.gz dist/mftiko-server_*.tar.gz dist/SHA256SUMS --clobber
