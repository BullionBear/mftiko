# `make proto` runs this with bin/tools on PATH (installed by `make tools`).
# No remote plugins. Contract A's TypeScript is `make openapi`, not buf (D1042).
version: v2
plugins:
  # Go: contract/gen/mftiko/<pkg>/v1/*.pb.go, matching each file's go_package.
  - local: protoc-gen-go
    out: .
    opt: module=github.com/BullionBear/mftiko
inputs:
  - directory: contract/proto
