# `make proto` runs this with bin/tools on PATH (installed by `make tools`).
# No remote plugins. Contract A's TypeScript is `make openapi`, not buf (E10-D043).
version: v2
plugins:
  # Go: contract/gen/mftiko/<pkg>/v1/*.pb.go, matching each file's go_package.
  - local: protoc-gen-go
    out: .
    opt: module=github.com/BullionBear/mftiko
  # gRPC handlers and clients for contract S: contract/gen/mftiko/sym/v1/symv1connect, a package of its own,
  # so symv1 and everything that imports it (the SDK) keep depending on protobuf only (E22-D005, E22-D006).
  # A proto file without a service generates nothing here.
  - local: protoc-gen-connect-go
    out: .
    opt: module=github.com/BullionBear/mftiko
inputs:
  - directory: contract/proto
