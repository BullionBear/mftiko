# buf v2 workspace. Protos live under contract/proto/; packages are mftiko.<contract>.v<major> (PROTOCOL §1).
version: v2
modules:
  - path: contract/proto
lint:
  use:
    - STANDARD
breaking:
  # Each contract evolves compatibly within a major (PROTOCOL §1). CI runs `make proto-breaking`.
  use:
    - FILE
  # Drafts (DECISIONS D007, the table in PROTOCOL §1): free to change until the epic that finalizes them takes them off
  # this list, as part of its done criteria. sym.proto came off in E2-10. mdctl.proto, md.proto and
  # read.proto came off in E4-12, went back on for D461, and came off again after #241 (D462).
  # tdctl.proto and td.proto came off in E6-15. td.proto stays on through #242 (D634); the follow-up
  # after that merge takes it off.
  # C3 and C4 come off when E1 ends.
  ignore:
    - contract/proto/mftiko/state/v1/state.proto # E: agent records in E1; demands, assignments, acks in E9
    - contract/proto/mftiko/session/v1/session.proto # E and C5: E9
    - contract/proto/mftiko/shim/v1/shim.proto # C3: E1
    - contract/proto/mftiko/worker/v1/worker.proto # C4: E1
    - contract/proto/mftiko/common/v1/common.proto # C4: E1
    - contract/proto/mftiko/stsctl/v1/stsctl.proto # C5: E8, E9
    - contract/proto/mftiko/td/v1/td.proto # C6: stays ignored through #242 (D634)
