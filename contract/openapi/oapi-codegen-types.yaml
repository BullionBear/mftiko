# Models for contract A (E10-D045). `make openapi` runs this.
# skip-prune keeps the SSE event schemas. They are referenced only from
# x-mftiko-events, which the pruner does not follow (E10-D036, E10-D038).
package: apiv1
output: contract/gen/api/v1/types.gen.go
generate:
  models: true
output-options:
  skip-prune: true
