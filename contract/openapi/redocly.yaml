# Redocly lint for contract A (E10-D002). `make openapi-lint` and CI run it (E10-D047).
extends:
  - recommended
rules:
  # The SSE event schemas (SessionRemovedEvent, ResetEvent, LogEvent, LogGapEvent,
  # LogEndEvent) are referenced from x-mftiko-events, which lint does not follow
  # (E10-D038, E14-D011).
  no-unused-components: off
  # The repository has no license file; the spec does not invent one.
  info-license: off
