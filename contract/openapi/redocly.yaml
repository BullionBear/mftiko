# Redocly lint for contract A (E10-D002). `make openapi-lint` and CI run it (E10-D047).
extends:
  - recommended
rules:
  # The SSE event schemas (SessionRemovedEvent, ResetEvent) are referenced from the
  # x-mftiko-events extension of GET /events, which lint does not follow (E10-D038).
  no-unused-components: off
  # The repository has no license file; the spec does not invent one.
  info-license: off
