# Local development only: `make dev-up` starts every service and waits until they are healthy; then
# `make migrate-up`. Ports are bound to 127.0.0.1, so nothing outside this machine can connect, and no service
# asks for credentials: PostgreSQL trusts local connections, etcd has no auth yet (E1-08 adds it), and NATS has
# none either. Tests do not use these: state starts its own etcd (etcdtest), natsx its own server (natsxtest).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mftiko
      POSTGRES_DB: mftiko
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mftiko", "-d", "mftiko"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One member, the same version the tests and CI use. A region's control plane in production is a cluster of its
  # own (D005); locally there is one region and so one etcd, at http://127.0.0.1:2379.
  etcd:
    image: gcr.io/etcd-development/etcd:v3.7.2
    command:
      - /usr/local/bin/etcd
      - --name=dev
      - --data-dir=/var/lib/etcd/data
      - --listen-client-urls=http://0.0.0.0:2379 # inside the container; the port mapping limits it to this machine
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=dev=http://127.0.0.1:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=mftiko-dev
      - --log-level=warn
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - etcddata:/var/lib/etcd
    healthcheck: # the image is distroless: no shell, so exec form
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Core NATS only, one server, the same release the tests embed
  # (github.com/nats-io/nats-server/v2 v2.15.0). The data plane (D002, D004): no JetStream, no cluster,
  # no authentication. The image's own config is not used; it opens a cluster port with a fixed route
  # password. Clients use nats://127.0.0.1:4222. The alpine image, not scratch, because the healthcheck
  # needs wget, which is busybox in that image. The monitor port stays inside the container.
  nats:
    image: nats:2.15.0-alpine
    command:
      - nats-server
      - --port
      - "4222"
      - --addr
      - 0.0.0.0 # inside the container; the port mapping limits it to this machine
      - --http_port
      - "8222"
      - --name
      - dev
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  etcddata:
