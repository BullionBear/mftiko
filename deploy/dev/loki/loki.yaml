# Loki for the dev stack: one process, filesystem storage in the lokidata volume (DECISIONS E16-D002).
# The ruler evaluates mftiko.rules.yml, which compose mounts as tenant "fake", the tenant Loki uses
# when auth is off, and sends to the dev Alertmanager (E16-D008). Retention is 24h (E16-D024).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  # No service_name label: the stream labels are the ones Alloy sets (E16-D004).
  discover_service_name: []

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  # Short, so a rule's for of 30s fires soon after it holds (E16-D024).
  evaluation_interval: 15s
  rule_path: /loki/ruler
  storage:
    type: local
    local:
      directory: /etc/loki/rules

analytics:
  reporting_enabled: false
