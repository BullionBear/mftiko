# Prometheus for the dev stack (DECISIONS E12-D038, E16-D008). It scrapes the API's /metrics, the
# only mftiko endpoint with metrics, without a bearer, evaluates mftiko.rules.yml and sends to the dev
# Alertmanager, the same one Loki's ruler sends to.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: mftiko-api
    # The mftiko_* series carry instance, the mftiko instance (md1, sts1, …). Without honor_labels
    # Prometheus renames it exported_instance and sets instance to this target (E16-D031).
    honor_labels: true
    static_configs:
      - targets: ["api:8080"]
