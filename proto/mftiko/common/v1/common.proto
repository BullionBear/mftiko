// Source of truth: docs/PROTOCOL.md. Keep the two in sync.
syntax = "proto3";

package mftiko.common.v1;

option go_package = "github.com/BullionBear/mftiko/gen/mftiko/common/v1;commonv1";

message WorkerRef {
  string key = 1;
  uint32 incarnation = 2;
  string note = 3; // CI probe: added without make proto
}

// agent 推給 worker 的指令版本，以 (epoch, seq) 的字典序比較。
// epoch 是持久化的計數器，不是 etcd revision，所以換 cluster 之後仍然單調。
message Version {
  int64 epoch = 1;
  uint64 seq = 2;
}

message Condition {
  string type = 1;
  bool status = 2;
  string reason = 3;
  string message = 4;
  int64 at_ns = 5;
}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> details = 4;
}

// worker 宣告的結束方式（D15）。
enum Outcome {
  OUTCOME_UNSPECIFIED = 0; // 沒有宣告：被殺，或在 Hello 之前就死了
  OUTCOME_DONE = 1;        // 正常結束：Stop，或策略呼叫 Exit
  OUTCOME_INIT_FAILED = 2; // Init 或 Start 失敗、逾時
  OUTCOME_FAILED = 3;      // 主動 fail
  OUTCOME_CRASHED = 4;     // hook panic 或回傳 error；OnStop 已跑
  OUTCOME_HUNG = 5;        // hook 卡太久，watchdog 結束；OnStop 沒跑
}

message ExitInfo {
  int32 code = 1;   // 被 signal 結束時為 -1
  int32 signal = 2; // 0 表示正常 exit
  int64 at_ns = 3;
  Outcome outcome = 4;
  string reason = 5;
  bool on_stop_completed = 6;
}
