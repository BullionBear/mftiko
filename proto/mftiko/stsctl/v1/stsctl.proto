// Source of truth: docs/PROTOCOL.md. Keep the two in sync.
syntax = "proto3";

package mftiko.stsctl.v1;

import "mftiko/common/v1/common.proto";
import "mftiko/state/v1/state.proto";

option go_package = "github.com/BullionBear/mftiko/gen/mftiko/stsctl/v1;stsctlv1";

message InitPayload {
  string session_id = 1;
  uint32 incarnation = 2;
  string sts_instance = 3;
  string name = 4;
  mftiko.state.v1.StrategyRef strategy = 5;
  bytes params = 6;
  repeated mftiko.state.v1.FeedDecl feeds = 7;
  repeated mftiko.state.v1.AccountDecl accounts = 8;
  NatsCredentials nats = 9; // 這個 session 專屬的 NATS 憑證，只經 socketpair 送進去（DECISIONS D30）
}

// STS agent 為這個 session 簽的 user JWT。權限見 PROTOCOL §7。
message NatsCredentials {
  string user_jwt = 1;
  string seed = 2;         // NKey seed，只在進程記憶體裡
  string inbox_prefix = 3; // _INBOX_{session_id}；SDK 以它設定 CustomInboxPrefix
}

message StartPayload {
  Bindings bindings = 1;
}

message Command {
  oneof cmd {
    Bindings bindings = 1; // 綁定變化（selector 換成員、資源 DEAD 等）
    Fail fail = 2;
  }
}

message Fail {
  string reason = 1;
}

// ack 的完整快照，由 STS agent 從 etcd 整理後轉送。
message Bindings {
  mftiko.common.v1.Version version = 1; // STS agent 為每個 session 產生，不是 etcd revision
  repeated FeedBinding feeds = 2;
  repeated SelectorBinding selectors = 3;
  repeated AccountBinding accounts = 4;
}

message FeedBinding {
  string feed = 1;
  string md_instance = 2;
  string subject = 3;
  mftiko.state.v1.EntryState state = 4;
}

message SelectorBinding {
  string name = 1;
  string md_instance = 2;
  mftiko.state.v1.Universe universe = 3;
  string subject_prefix = 4; // 成員的 subject 是 {subject_prefix}.{topic}.{ticker}
}

message AccountBinding {
  string name = 1;
  int64 api_id = 2;
  mftiko.state.v1.EntryState state = 3;
  mftiko.common.v1.WorkerRef worker = 4;
}

message Report {
  mftiko.common.v1.Version bindings_applied = 1;
  string hook = 2;
  uint64 hook_blocked_ms = 3;
  uint64 hook_slow = 4;
  repeated QueueStat queues = 5;
}

// name 是 td 或 md（D24）。
message QueueStat {
  string name = 1;
  uint32 depth = 2;
  uint64 dropped = 3;    // md：因超過 recv_window_ms 或 buffer 滿而丟掉的則數
  uint32 max_age_ms = 4; // 上一個回報週期內，交給 hook 的事件中最老的那則的年齡
}
