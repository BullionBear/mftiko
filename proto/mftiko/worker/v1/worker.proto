// Source of truth: docs/PROTOCOL.md. Keep the two in sync.
syntax = "proto3";

package mftiko.worker.v1;

import "mftiko/common/v1/common.proto";

option go_package = "github.com/BullionBear/mftiko/gen/mftiko/worker/v1;workerv1";

// ---------- worker → shim ----------

message WorkerUp {
  oneof msg {
    Hello hello = 1;
    Done done = 2;
    Stage stage = 3;
    Beat beat = 4;
    Report report = 5;
    Relay relay = 6;
    Exiting exiting = 7;
    Stopped stopped = 8;
  }
}

message Hello {
  string kind = 1;               // session | account | conn
  string release = 2;
  repeated string contracts = 3; // 支援的 C5 契約，例如 "mdctl.v1"
  int32 pid = 4;
}

enum Verb {
  VERB_UNSPECIFIED = 0;
  VERB_INIT = 1;
  VERB_START = 2;
}

message Done {
  Verb verb = 1;
  bool ok = 2;
  string error = 3;
}

message Stage {
  string name = 1;
}

message Beat {
  uint64 seq = 1;
  bytes progress = 2;
}

message Report {
  string contract = 1;
  bytes payload = 2; // 該平面 C5 的 Report，最新一份取代舊的
}

message Relay {
  string contract = 1;
  bytes corr_id = 2;
  bytes payload = 3;
}

message Exiting {
  mftiko.common.v1.Outcome outcome = 1;
  string reason = 2;
  string detail = 3;
}

message Stopped {
  bool on_stop_completed = 1;
}

// ---------- shim → worker ----------

message WorkerDown {
  oneof msg {
    Init init = 1;
    Start start = 2;
    Stop stop = 3;
    Relay relay = 4;
    Undeliverable undeliverable = 5;
    Controller controller = 6;
  }
}

message Init {
  string contract = 1;
  bytes payload = 2; // 該平面 C5 的 InitPayload
  uint32 deadline_ms = 3;
}

message Start {
  string contract = 1;
  bytes payload = 2; // 該平面 C5 的 StartPayload
  uint32 deadline_ms = 3;
}

message Stop {
  string reason = 1;
  uint32 grace_ms = 2;
}

message Undeliverable {
  bytes corr_id = 1;
}

message Controller {
  bool attached = 1;
  int64 epoch = 2;
}
